name: CI-CD

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Display Repository Structure
        run: |
          pwd
          ls -la
          echo "----------------------"
          ls -la CatelogServices
          echo "----------------------"
          ls -la CatelogServices/target || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Maven Project
        run: mvn clean install -DskipTests

      - name: Verify Target Folder
        run: |
          echo "----------------------"
          ls -la CatelogServices
          echo "----------------------"
          ls -la CatelogServices/target

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name containerRegistryName1

      - name: Build Docker Image
        run: |
          docker build \
            -f CatelogServices/Dockerfile \
            -t catalog-service:latest \
            CatelogServices

      - name: Tag Docker Image
        run: |
          docker tag catalog-service:latest containerregistryname1.azurecr.io/catalog-service:latest

      - name: Push Docker Image
        run: |
          docker push containerregistryname1.azurecr.io/catalog-service:latest