name: CI-CD

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name containerRegistryName1

      - name: Build Docker image
        run: docker build -t catalog-service ./CatelogServices

      - name: Tag Docker image
        run: |
          docker tag catalog-service:latest containerregistryname1.azurecr.io/catalog-service:latest

      - name: Push Docker image
        run: |
          docker push containerregistryname1.azurecr.io/catalog-service:latest